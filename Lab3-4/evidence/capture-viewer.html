<!doctype html><html lang="en"><meta charset="utf-8"><title>SSH execution record</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#12161c;color:#e9edf3;font-family:Arial,sans-serif;min-height:100vh;overflow:auto}header{height:82px;padding:12px 22px;background:#202831;border-bottom:1px solid #44505d}h1{font-size:20px;margin:0 0 7px}small{font-size:12px;color:#bec9d5}main{display:block;padding:14px 22px}section{flex:1;min-width:0;display:block;margin-bottom:25px}h2{font-size:14px;margin:0 0 10px;color:#bdd8ea}pre{margin:0;font-family:Menlo,monospace;font-size:16px;line-height:1.32;white-space:pre-wrap;overflow-wrap:anywhere;overflow:visible}footer{position:static;margin:12px 22px;font-size:10px;background:#12161c;color:#9facb8}
</style><header><h1 id="title">Loading record</h1><small id="origin"></small></header><main><section id="codepanel"><h2>Source excerpt</h2><pre id="code"></pre></section><section><h2>Recorded command output</h2><pre id="output"></pre></section></main><footer id="hash"></footer>
<script>
fetch('word-figures/captures.json').then(r=>r.json()).then(all=>{
const id=new URLSearchParams(location.search).get('id');const c=all[id];if(!c)throw Error('Unknown capture '+id);
document.querySelector('#title').textContent=c.title;
document.querySelector('#origin').textContent='READ-ONLY EXECUTION RECORD · Ubuntu SSH · 9 November 2026 · '+c.source;
document.querySelector('#code').textContent=c.code||'';document.querySelector('#output').textContent=c.output;
if(!c.code)document.querySelector('#codepanel').style.display='none';
document.querySelector('#hash').textContent='Output SHA256 '+c.sha256.slice(0,24);
document.title='Execution record '+id;
});
</script></html>
